version: "3.9"

services:
  # Redis Stack: Phase 1 Hash Cache + Phase 2 Vector Search 준비
  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: llm-opt-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # Redis Insight (Web UI)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus: 메트릭 수집
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: llm-opt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      redis:
        condition: service_healthy

  # Grafana: 메트릭 시각화 대시보드 — Phase 5
  grafana:
    image: grafana/grafana:11.4.0
    container_name: llm-opt-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/llm-opt.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
